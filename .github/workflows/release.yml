name: Release

# Creates the tag and GitHub release automatically when RELEASE_VERSION carries a new version.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Firmware-ZIP packen
        run: zip -qr -9 "${{ github.event.repository.name }}.zip" "Color UI" "Classic UI" "LVGL UI" README.md

      - name: Release anlegen, falls neu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(head -n1 RELEASE_VERSION | tr -d '[:space:]')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits."
            exit 0
          fi
          gh release create "$TAG" "${{ github.event.repository.name }}.zip" \
            --target "$GITHUB_SHA" --title "Marlin 2.1.2.9 predefined update.cbd + assets (STM32F103)" --notes-file RELEASE_NOTES.md --latest
